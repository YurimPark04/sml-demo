[project]
# 저장된 데이터셋 pkl을 입력으로 모델 학습/평가를 수행하는 패키지.
name = "sml-modeling"
version = "0.1.0"
description = "Model training package for the TOBE SML demo."
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 이 디렉터리 아래의 sml_modeling 패키지만 배포 대상으로 잡는다.
where = ["."]
include = ["sml_modeling*"]
